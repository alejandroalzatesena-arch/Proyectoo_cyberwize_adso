<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-MAZE | Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="scanline"></div>
    <header class="cyber-header">
        <div class="header-top">
            <h1 class="neon-text">CYBER<span>_MAZE</span></h1>
            <button id="menuToggle" class="menu-hamburger">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="ESCANEANDO RED..." autocomplete="off">
                <button id="searchBtn" class="btn-neon-small">SCAN</button>
            </div>
            <div class="history-container">
                <div id="recentSearches" class="recent-searches"></div>
                <button id="clearHistory" class="btn-delete-small">×</button>
            </div>
        </div>
    </header>
    <nav id="mainNav" class="control-panel">
        <div class="nav-group">
            <label>SECTOR:</label>
            <select id="genreFilter" class="cyber-select"><option value="all">TODOS</option></select>
        </div>
        <div class="nav-group">
            <label>NODOS:</label>
            <select id="itemsPerPage" class="cyber-select">
                <option value="12">12</option>
                <option value="24">24</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
        <a href="favorites.html" class="btn-glitch">FAVORITOS_DB</a>   
    </nav>
    <main id="movieGrid" class="movie-grid"></main>
    <footer class="cyber-footer">
        <button id="prevPage" class="btn-neon-small">PREV</button>
        <span id="pageInfo" class="neon-text">PÁGINA 1</span>
        <button id="nextPage" class="btn-neon-small">NEXT</button>
    </footer>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
